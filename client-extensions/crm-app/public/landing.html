<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Đăng Ký Khóa Học - MekoCRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #eaf3e6; }
    .btn-red { background-color: #921c24; transition: background-color 0.2s; }
    .btn-red:hover { background-color: #7a151e; }
    .btn-red:disabled { background-color: #d9d9d9; cursor: not-allowed; }
    .input-field { border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.5rem 0.75rem; width: 100%; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: #921c24; box-shadow: 0 0 0 1px #921c24; }
    .label-text { font-size: 0.875rem; font-weight: 600; color: #111827; margin-bottom: 0.25rem; display: block; }
    .required { color: #ef4444; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white py-4 px-8 flex justify-between items-center shadow-sm">
    <div class="text-2xl font-bold tracking-tight">
      <span class="text-[#1a365d]">Meko</span><span class="text-[#e53e3e]">CRM</span>
    </div>
    <nav class="hidden md:flex space-x-8 font-medium text-gray-700">
      <a href="#" class="hover:text-red-700">Trang chủ</a>
      <a href="#" class="hover:text-red-700">Các khóa học & kỳ thi</a>
      <a href="#" class="hover:text-red-700">Về MekoCRM</a>
    </nav>
    <div>
      <svg class="w-8 h-8 text-gray-600 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-8">
      <div class="text-center mb-6">
        <h1 class="text-xl font-bold text-gray-900 flex items-center justify-center gap-2">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          Form đăng ký khóa học
        </h1>
      </div>

      <form id="regForm" onsubmit="submitForm(event)" class="space-y-4">
        
        <!-- Họ và tên -->
        <div>
          <label class="label-text">Họ và tên <span class="required">*</span></label>
          <input type="text" id="leadName" class="input-field" placeholder="Nhập họ tên đầy đủ của bạn" required>
        </div>

        <!-- Email -->
        <div>
          <label class="label-text">Email <span class="required">*</span></label>
          <input type="email" id="leadEmail" class="input-field" placeholder="Nhập email hợp lệ" required>
        </div>

        <!-- Số điện thoại -->
        <div>
          <label class="label-text">Số điện thoại <span class="required">*</span></label>
          <input type="tel" id="leadPhone" class="input-field" placeholder="Nhập số điện thoại" required>
        </div>

        <!-- Môn học quan tâm -->
        <div>
          <label class="label-text">Môn học quan tâm <span class="required">*</span></label>
          <select id="courseSelect" class="input-field" required>
            <option value="">Chọn môn học</option>
            <!-- Courses loaded dynamically -->
          </select>
        </div>

        <!-- Kết quả mong muốn -->
        <div>
          <label class="label-text">Kết quả mong muốn <span class="required">*</span></label>
          <input type="text" id="expectedResult" class="input-field" placeholder="Nhập số điểm tối thiểu mà bạn kỳ vọng" required>
        </div>

        <!-- Ngày sinh -->
        <div>
          <label class="label-text">Ngày sinh <span class="required">*</span></label>
          <input type="date" id="leadBirthday" class="input-field" required>
        </div>

        <!-- Khung thời gian rảnh tư vấn -->
        <div>
          <label class="label-text">Khung thời gian rảnh tư vấn <span class="required">*</span></label>
          <input type="text" id="freeTime" class="input-field" placeholder="VD: Buổi tối 19h - 21h, T7 CN" required>
        </div>

        <!-- Note -->
        <div>
          <label class="label-text">Note (không bắt buộc)</label>
          <textarea id="leadNote" class="input-field" rows="2" placeholder="Ghi chú thêm mong muốn của bạn"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" id="btnSubmit" class="w-full btn-red text-white font-bold py-3 rounded-lg text-center">
            Đăng ký ngay
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Popup -->
  <div id="popup" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-xl max-w-sm w-full text-center transform transition-all">
      <div id="popupIcon" class="text-4xl mb-4"></div>
      <h3 id="popupTitle" class="text-xl font-bold mb-2"></h3>
      <p id="popupDesc" class="text-gray-600 mb-6 text-sm"></p>
      <button onclick="closePopup()" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-700 w-full">Đóng</button>
    </div>
  </div>

  <script>
    async function loadCourses() {
      try {
        const res = await fetch('/api/courses');
        const courses = await res.json();
        const select = document.getElementById('courseSelect');
        select.innerHTML = '<option value="">Chọn môn học</option>';
        courses.forEach(c => {
          select.innerHTML += `<option value="${c.id}">${c.courseName}</option>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Đang xử lý...';
      btn.disabled = true;

      const kq = document.getElementById('expectedResult').value.trim();
      const time = document.getElementById('freeTime').value.trim();
      const extraNote = document.getElementById('leadNote').value.trim();
      const noteStr = `Kỳ vọng: ${kq}. Giờ rảnh: ${time}. Ghi chú: ${extraNote}`;

      let birthdayStr = document.getElementById('leadBirthday').value;
      if (birthdayStr) {
        birthdayStr = new Date(birthdayStr).toISOString();
      }

      const payload = {
        leadName: document.getElementById('leadName').value.trim(),
        leadPhone: document.getElementById('leadPhone').value.trim(),
        leadEmail: document.getElementById('leadEmail').value.trim(),
        courseId: document.getElementById('courseSelect').value,
        leadBirthday: birthdayStr,
        leadSource: 'Form',
        note: noteStr
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showPopup('✅', 'Thành Công!', data.message);
          document.getElementById('regForm').reset();
        } else {
          showPopup('⚠️', 'Chưa Thể Gửi', data.message || 'Có lỗi xảy ra, vui lòng thử lại sau!');
        }
      } catch (err) {
        showPopup('❌', 'Lỗi Kết Nối', 'Không thể kết nối đến máy chủ. Vui lòng thử lại sau!');
      } finally {
        btn.innerText = 'Đăng ký ngay';
        btn.disabled = false;
      }
    }

    function showPopup(icon, title, desc) {
      document.getElementById('popupIcon').innerText = icon;
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupDesc').innerText = desc;
      document.getElementById('popup').classList.remove('hidden');
      document.getElementById('popup').classList.add('flex');
    }

    function closePopup() {
      document.getElementById('popup').classList.add('hidden');
      document.getElementById('popup').classList.remove('flex');
    }

    loadCourses();
  </script>
</body>
</html>
